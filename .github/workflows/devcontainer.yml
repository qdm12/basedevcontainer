# Shared checks for the dev container, called as a job by Alpine and Debian
# (see their verify job). It is not triggerable on its own: the callers keep
# their own triggers, so a change to alpine.Dockerfile only runs the Alpine
# copy of these jobs, and .devcontainer/** changes run both.
#
#
# Other repositories cannot call this workflow, even with their own Dockerfile
# and image: GitHub resolves the ./.github/actions references below against the
# caller's checkout, not against this repository, and fails with "Can't find
# action.yml". They call the same composite actions from their own workflow
# instead, with a pinned cross-repository reference:
# uses: qdm12/basedevcontainer/.github/actions/devcontainer-jsonc@v0.30.0
#
# The composite actions are the reusable unit here; this workflow is the local
# wiring of them, for Alpine and Debian.
name: Devcontainer

on:
  workflow_call:
    inputs:
      dockerfile:
        description: Dockerfile to build the dev container base image from
        required: true
        type: string
      image:
        description: >-
          Image tag to build, and to start the dev container from. It has to be
          the FROM of the repository's .devcontainer/Dockerfile.
        required: false
        default: ghcr.io/qdm12/basedevcontainer:latest
        type: string

jobs:
  jsonc:
    name: JSONC syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: ./.github/actions/devcontainer-jsonc

  build-image:
    name: Build image
    needs: [jsonc]
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILDKIT: "1"
      # Tagged :latest because .devcontainer/Dockerfile has an untagged FROM:
      # the dev container must be built from the Dockerfile under test, not from
      # the published image, which lags behind master. Nothing is pushed, the
      # tag only ever exists on that runner.
      IMAGE: ${{ inputs.image }}
    steps:
      - uses: actions/checkout@v6

      - name: Build image
        run: docker build -f "${{ inputs.dockerfile }}" -t "$IMAGE" .

      # Both engines of the matrix below load this archive instead of building:
      # they keep separate image stores and cannot share a build cache.
      - name: Export image
        run: docker save "$IMAGE" | gzip -1 > "$RUNNER_TEMP/image.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: devcontainer-image
          path: ${{ runner.temp }}/image.tar.gz
          compression-level: 0
          retention-days: 1

  devcontainer-up:
    name: devcontainer up (${{ matrix.engine }})
    needs: [jsonc, build-image]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: [docker, podman]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/download-artifact@v4
        with:
          name: devcontainer-image
          path: ${{ runner.temp }}

      - uses: ./.github/actions/devcontainer-up
        with:
          engine: ${{ matrix.engine }}
